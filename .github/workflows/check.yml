name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx openchamber-guest-bundle status/main.ts status/main.js
      - run: bunx openchamber-guest-bundle --node service/main.ts service/main.js
      - run: bunx openchamber-guest-check
